# Builds the WebAssembly demo in web/ and tests it on pull requests and pushes to
# main; pushes to main (and manual runs) then publish web/dist to GitHub Pages.
# Pages must use GitHub Actions as its source (Settings > Pages > Source).
name: Web demo

# The tests also compare with the Python package and reproduce/nhanes.py.
on:
  push:
    branches: [main]
    paths: ['core/**', 'web/**', 'NHANES/**', 'python/neuralplsi/**', 'reproduce/nhanes.py', '.github/workflows/web.yml']
  pull_request:
    paths: ['core/**', 'web/**', 'NHANES/**', 'python/neuralplsi/**', 'reproduce/nhanes.py', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scipy scikit-learn matplotlib
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - run: web/build.sh
      - run: node --test web/tests/*.test.js
        env:
          NPLSI_BROWSER: '0'
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a newer one waits rather than cancelling a running one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

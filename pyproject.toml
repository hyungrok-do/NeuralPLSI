[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "neuralplsi"
dynamic = ["version"]
description = "Neural-network partial-linear single-index models with bootstrap inference, on a C++ engine."
readme = "python/README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hyungrok Do" }]
keywords = ["single-index model", "environmental mixtures", "neural network", "bootstrap", "survival"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23.5", "pandas>=2.0.0", "scipy>=1.10.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/hyungrok-do/NeuralPLSI"
Paper = "https://arxiv.org/abs/2512.11593"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.16"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/neuralplsi"]
# The engine is loaded through ctypes (no Python C API), so one wheel per
# platform serves every Python 3 version.
wheel.py-api = "py3"
# Only the engine and the package: the R package, the web demo, the
# reproduction scripts, results and data are not part of the Python sdist.
sdist.exclude = ["/.claude", "/.github", "/NHANES", "/logs", "/output", "/r", "/reproduce",
                 "/results", "/web", "/python/examples", "/python/tests",
                 "__pycache__", "*.py[cod]", ".DS_Store"]

[tool.scikit-build.metadata.version]
# The version is set once, in python/neuralplsi/_version.py.
provider = "scikit_build_core.metadata.regex"
input = "python/neuralplsi/_version.py"

[tool.pytest.ini_options]
# reproduce/tests need reproduce/requirements.txt: python -m pytest reproduce/tests
testpaths = ["python/tests"]
